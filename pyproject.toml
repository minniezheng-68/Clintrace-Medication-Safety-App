[project]
name = "clintrace"
version = "0.1.0"
description = "Traceable LangGraph agent for an educational chronic-medication safety capstone."
authors = [{ name = "ClinTrace Capstone Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3>=1.40.0,<2",
    "cryptography>=46.0.0",
    "httpx>=0.28.0",
    "langchain>=1.3.10",
    "langchain-openai>=1.1.14",
    "langgraph>=1.0.0",
    "fastapi>=0.116.0",
    "pydantic>=2.12.0",
    "pypdf>=6.1.1",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sqlalchemy[asyncio]>=2.0.46",
    "alembic>=1.18.1",
    "psycopg[binary,pool]>=3.3.2",
    "pyjwt[crypto]>=2.12.0",
    "langgraph-checkpoint-postgres>=3.0.0",
]


[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["clintrace*"]


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"benchmark/*" = ["D", "T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
# CVE-2026-32597: pyjwt < 2.12.0 accepts unknown `crit` header extensions.
# Transitive via langgraph-api -> pyjwt. Remove once langgraph-api requires pyjwt>=2.12.0.
constraint-dependencies = ["pyjwt>=2.12.0"]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.15.0",
]
